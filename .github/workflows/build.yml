name: Build dashboards

on:
  schedule:
    # Час у UTC. Влітку Варшава = UTC+2, узимку UTC+1.
    # Розклад прив'язаний до моменту ПУБЛІКАЦІЇ даних, а не до перегляду —
    # на сайті завжди лежить остання вдала збірка.
    #
    # Ранкові — під огляд о 12:10 за Варшавою. OCC викладає нічний OI
    # по США в ранні години за Нью-Йорком, точний момент не фіксований,
    # тому пробуємо кілька разів: яка збірка перша зловить свіже, та й
    # опублікує. Зайві прогони нешкідливі — якщо новішого немає,
    # сторінка просто перемальовується тими самими даними.
    - cron: "0 6 * * 1-6"      # 08:00 Варшава
    - cron: "0 9 * * 1-6"      # 11:00 Варшава
    - cron: "40 9 * * 1-6"     # 11:40 Варшава — остання перед оглядом
    #
    # Денна: Eurex уже виклав вчорашню сесію DAX (після 12:00 CET)
    - cron: "0 13 * * 1-5"     # 15:00 Варшава
    #
    # Вечірня: сесія США закрилась — фінальний обсяг і ціна закриття
    - cron: "30 21 * * 1-5"    # 23:30 Варшава
  workflow_dispatch:        # кнопка «запустити зараз» вручну

permissions:
  contents: write           # щоб комітити базу назад
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Встановити залежності
        run: pip install -r requirements.txt

      - name: Перевірити комплектність проєкту
        run: |
          missing=""
          for f in visualize.py visualize_us.py make_index.py \
                   src/analytics.py src/black76.py src/cboe_provider.py \
                   src/database.py src/eurex_provider.py src/futures_price.py \
                   src/gex.py src/models.py; do
            [ -f "$f" ] || missing="$missing\n  $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::У репозиторії бракує файлів:"
            printf "$missing\n"
            echo ""
            echo "Завантаж їх через Add file → Upload files, зберігаючи структуру папок."
            exit 1
          fi
          echo "Усі файли на місці."

      - name: Зібрати DAX
        env:
          OPTIONS_HEADLESS: "1"
          OPTIONS_OUT_DIR: site
        run: python visualize.py
        continue-on-error: true      # збій Eurex не має валити збірку США

      - name: Зібрати SPX / NDX
        env:
          OPTIONS_HEADLESS: "1"
          OPTIONS_OUT_DIR: site
        run: python visualize_us.py
        continue-on-error: true

      - name: Титульна сторінка
        env:
          OPTIONS_OUT_DIR: site
        run: python make_index.py

      - name: Підстрахувати відсутні сторінки
        # Сайт публікується з нуля щоразу. Якщо Eurex або Cboe не відповіли,
        # відповідний файл не згенерувався б і посилання на сайті зламалося б.
        # Тому підтягуємо останню опубліковану версію — краще вчорашні дані,
        # ніж «сторінку не знайдено». Дата всередині покаже, що вона стара.
        env:
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          for f in dax_options.html us_options.html; do
            if [ ! -f "site/$f" ]; then
              echo "::warning::$f не зібрався — беру попередню версію з сайту"
              curl -sfL --max-time 60 "$SITE/$f" -o "site/$f" \
                || echo "::warning::попередньої версії $f теж немає"
            fi
          done

      - name: Перевірити, що щось зібралось
        run: |
          ls -lh site/
          test -f site/index.html
          # хоча б один дашборд має бути на місці
          test -f site/dax_options.html || test -f site/us_options.html

      - name: Зберегти бази для Δ OI
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f options_data.db us_options.db 2>/dev/null || true
          git diff --staged --quiet || git commit -m "дані $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push || echo "нема чого пушити"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
